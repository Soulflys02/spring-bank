spring:
  application:
    name: spring-bank
  docker:
    compose:
      # compose.yaml est à la racine du dépôt, partagé par le back et le front
      file: ../compose.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/spring-bank
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  api-docs:
    version: openapi_3_0
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
  swagger-ui:
    oauth:
      client-id: spring-bank-front
      use-pkce-with-authorization-code-grant: true
