name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/openapi.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/openapi.json'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

# A new push on the same branch cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # OpenAPI Generator runs on Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Install the dependencies
        run: npm ci

      # git status also lists new files, which git diff would miss
      - name: Check the generated API models are up to date
        run: |
          npm run generate:api
          if [ -n "$(git status --porcelain -- src/app/api)" ]; then
            git status --porcelain -- src/app/api
            git diff -- src/app/api
            echo "::error::src/app/api is out of date: run npm run generate:api and commit the result"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Run the unit tests
        run: npm test -- --watch=false
